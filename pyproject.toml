[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecotyper"
version = "0.1.0"
description = "Python/AnnData port of EcoTyper (Luca, Steen et al., Cell 2021) with numerical parity to the R implementation"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
authors = [{ name = "Python port contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "numba>=0.59",
    "pyyaml>=6",
]

[project.optional-dependencies]
icu = ["PyICU>=2.10"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[project.scripts]
ecotyper-py = "ecotyper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "r: needs the ecotyper-r conda environment (Rscript) to generate references",
    "e2e: end-to-end comparison against R reference outputs (slow)",
]
