[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecotyper-py"
version = "0.1.0"
description = "Python/AnnData port of EcoTyper (Luca, Steen et al., Cell 2021) with numerical parity to the R implementation"
readme = "README.md"
license = "LicenseRef-Stanford-NonCommercial"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "Ho Seok Lee" }]
keywords = ["ecotyper", "anndata", "scverse", "single-cell", "spatial transcriptomics", "cell states", "NMF"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "numba>=0.59",
    "pyyaml>=6",
]

[project.optional-dependencies]
icu = ["PyICU>=2.10"]
plot = ["matplotlib>=3.7"]
sklearn = ["scikit-learn>=1.3"]
test = ["pytest>=7"]
docs = ["sphinx>=7", "furo", "myst-parser>=2", "sphinx-copybutton", "sphinx-design"]

[project.urls]
Documentation = "https://hoseok-lee.github.io/ecotyper-py/"
"Original EcoTyper (R)" = "https://github.com/digitalcytometry/ecotyper"

[project.scripts]
ecotyper-py = "ecotyper.cli:main"

[tool.setuptools.package-data]
ecotyper = ["*.c", "rcompat/*.c"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "r: needs the ecotyper-r conda environment (Rscript) to generate references",
    "e2e: end-to-end comparison against R reference outputs (slow)",
]
