# Builds and uploads to PyPI when a GitHub release is published, using PyPI Trusted
# Publishing: no API token is stored anywhere; PyPI trusts this workflow in this repo.
# One-time setup on pypi.org: project ecotyper-py -> Manage -> Publishing -> add a GitHub
# publisher (owner hoseok-lee, repo ecotyper-py, workflow publish.yml, environment pypi).
name: publish

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME != version $v in pyproject.toml"; exit 1; }
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ecotyper-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
